name: SmartTutorAI CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ========================================================
  # Job 1: Backend CI (Unit tests, edge cases, model router)
  # ========================================================
  backend-ci:
    name: Backend CI (Python 3.11)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "**/requirements.txt"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Backend Edge Cases & Regression Tests
        env:
          GEMINI_API_KEY: "mock_ci_gemini_key"
          GROQ_API_KEY: "mock_ci_groq_key"
          SUPABASE_URL: "https://mock.supabase.co"
          SUPABASE_SERVICE_ROLE_KEY: "mock_service_role_key"
        run: |
          python test_edge_cases.py -v

      - name: Verify FastAPI App Startup & Import Integrity
        env:
          GEMINI_API_KEY: "mock_ci_gemini_key"
          GROQ_API_KEY: "mock_ci_groq_key"
          SUPABASE_URL: "https://mock.supabase.co"
          SUPABASE_SERVICE_ROLE_KEY: "mock_service_role_key"
        run: |
          python -c "import main; print(' FastAPI application schema initialized successfully.')"

  # ========================================================
  # Job 2: Frontend CI (TypeScript compilation & Next.js build)
  # ========================================================
  frontend-ci:
    name: Frontend CI (Node 20 / Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: "**/package-lock.json"

      - name: Install Node dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Run TypeScript Type Check
        run: npx tsc --noEmit

      - name: Build Next.js Application
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NODE_ENV: production
          NEXT_PUBLIC_AGENT_API: "https://smarttutorai.onrender.com"
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: "pk_test_Y2xlcmsuZXhhbXBsZS5jb20k"
          NEXT_PUBLIC_SUPABASE_URL: "https://mock.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "mock_anon_key"
        run: npm run build

  # ========================================================
  # Job 3: Docker Build Verification (Multi-stage containers)
  # ========================================================
  docker-ci:
    name: Docker Build & Compose Check
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: smarttutor-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: smarttutor-frontend:latest
          build-args: |
            NEXT_PUBLIC_AGENT_API=http://backend:8000
            NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=pk_test_Y2xlcmsuZXhhbXBsZS5jb20k
            NEXT_PUBLIC_SUPABASE_URL=https://mock.supabase.co
            NEXT_PUBLIC_SUPABASE_ANON_KEY=mock_anon_key
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Validate Docker Compose Configuration
        run: docker compose config

[project]
name = "backend"
version = "0.1.0"
description = "Backend for educational AI agent"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langchain[google-genai]>=0.3.26",
    "langchain-community>=0.3.26",
    "python-dotenv>=1.1.1",
    "langgraph>=0.5.0",
    "duckduckgo-search>=8.0.5",
    "supabase>=2.16.0",
    "graphviz>=0.21",
    "boto3>=1.39.3",
    "fastapi>=0.115.14",
    "uvicorn>=0.35.0",
    "gtts>=2.5.4",
    "google-generativeai>=0.8.6",
    "langchain-openai>=0.3.0",
    "openai>=1.50.0",
    "langchain-groq>=0.2.0",
    "langchain-mistralai>=0.2.0",
    "mistralai>=1.0.0",
    "groq>=0.11.0",
    "elevenlabs>=1.0.0",
    "httpx>=0.27.0",
    "requests>=2.31.0",
    "pypdf>=4.0.0",
    "youtube-transcript-api>=0.6.0",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29.5",
]
